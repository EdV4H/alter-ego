<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alter-ego / react-web</title>
    <script>
      // 保存したテーマを React より先に当てて、読み込み直後のちらつきを防ぐ（src/ui/theme.ts と同じキー）
      try {
        const t = localStorage.getItem("alter-ego-demo-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
