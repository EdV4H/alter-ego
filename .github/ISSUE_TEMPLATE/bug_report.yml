name: バグ報告
description: 期待どおりに動かない挙動を報告する
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      description: 可能ならスキーマ JSON とプラグイン構成の最小例を添えてください
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した挙動
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: パッケージとバージョン（またはコミット）
  - type: input
    id: env
    attributes:
      label: 実行環境（ブラウザ / Node.js のバージョン）
